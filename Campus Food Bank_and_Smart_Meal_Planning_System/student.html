<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Food Bank - Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar px-3 py-2">
    <span class="fw-bold">Campus Food Bank</span>
    <div class="d-flex gap-2 align-items-center">
      <span class="small d-none d-sm-inline">Hi, <b id="userName"></b></span>
      <button class="btn btn-red btn-sm" onclick="showPage('inventory')">View Inventory</button>
      <button class="btn btn-red btn-sm" onclick="showPage('list')">
        <i class="bi bi-cart3"></i> Shopping List <span class="badge bg-light text-dark" id="listCount">0</span>
      </button>
      <button class="btn btn-outline-dark btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container py-4" id="inventoryPage">
    <h1 class="text-center dark-red mb-4">Welcome Back Students</h1>
    <div class="input-group search-box mx-auto mb-4">
      <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
      <input type="text" class="form-control" id="search" placeholder="Type here to search food items...">
      <button class="btn bg-white" onclick="clearSearch()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="row g-3" id="foodGrid"></div>
  </div>

  <div class="container py-4 d-none" id="listPage">
    <h1 class="text-center dark-red mb-4">Shopping List</h1>
    <div class="card p-3">
      <table class="table align-middle mb-0">
        <thead>
          <tr><th>Item</th><th>Category</th><th style="width:140px">Quantity</th><th></th></tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
      <p class="text-center text-muted my-3 d-none" id="emptyMsg">Your shopping list is empty.</p>
      <div class="text-end mt-2">
        <button class="btn btn-outline-danger btn-sm" onclick="clearList()">Clear List</button>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast text-bg-dark"><div class="toast-body" id="toastText"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="student.js"></script>
</body>
</html>
