<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Food Bank - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center title mb-4">Campus Food Bank</h1>

    <div class="card form-card mx-auto p-4" id="loginBox">
      <h4 class="text-center red-text mb-3">Welcome Back!</h4>
      <form id="loginForm">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" class="form-control mb-3" id="loginUser" required>
        <label class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control mb-3" id="loginPass" required>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-red w-50">Login</button>
          <button type="button" class="btn btn-red w-50" onclick="showRegister()">Register</button>
        </div>
      </form>
      <p class="text-center small mt-3 mb-0">Don't have an account? <a href="#" onclick="showRegister()">Register now</a></p>
      <div id="loginMsg" class="mt-3"></div>
    </div>

    <div class="card form-card mx-auto p-4 d-none" id="registerBox">
      <h4 class="text-center red-text mb-3">Welcome!</h4>
      <form id="registerForm">
        <label class="form-label fw-semibold">Create Username</label>
        <input type="text" class="form-control mb-3" id="regUser" required>
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control mb-3" id="regEmail" required>
        <label class="form-label fw-semibold">Create Password</label>
        <input type="password" class="form-control mb-1" id="regPass" minlength="6" required>
        <div class="form-text mb-3">Password must be at least 6 characters.</div>
        <button type="submit" class="btn btn-red w-100">Register</button>
      </form>
      <p class="text-center small mt-3 mb-0">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
      <div id="regMsg" class="mt-3"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
